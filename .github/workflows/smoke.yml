name: Smoke check deployment

on: deployment_status

permissions: {}

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public pages return 200
        env:
          ENVIRONMENT: ${{ github.event.deployment.environment }}
          DEPLOYMENT_URL: ${{ github.event.deployment_status.environment_url || github.event.deployment_status.target_url }}
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL || 'https://seller-business-advisor.vercel.app' }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          if [ "$ENVIRONMENT" = "Production" ]; then
            base="$PRODUCTION_URL"
          elif [ -n "$BYPASS" ]; then
            base="$DEPLOYMENT_URL"
          else
            echo "::notice::Preview deployments are behind Vercel Authentication; add VERCEL_AUTOMATION_BYPASS_SECRET to smoke-test them."
            exit 0
          fi
          headers=()
          if [ -n "$BYPASS" ]; then headers=(-H "x-vercel-protection-bypass: $BYPASS"); fi
          failed=0
          for path in / /dang-ky /robots.txt /sitemap.xml; do
            code=000
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "${headers[@]}" "${base%/}$path")
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "$path -> $code"
            if [ "$code" != "200" ]; then failed=1; fi
          done
          if [ "$failed" = 1 ]; then
            echo "::error::A public page did not return 200 on $ENVIRONMENT ($base)."
            exit 1
          fi
