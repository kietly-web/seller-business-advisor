name: Smoke check production

# Vercel reports deployments to GitHub as a commit status named "Vercel", not as GitHub Deployments
on:
  status:
  workflow_dispatch:

permissions: {}

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.context == 'Vercel' && github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Public pages return 200
        env:
          BASE: ${{ vars.PRODUCTION_URL || 'https://seller-business-advisor.vercel.app' }}
        run: |
          failed=0
          for path in / /dang-ky /robots.txt /sitemap.xml; do
            code=000
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' "${BASE%/}$path")
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "$path -> $code"
            if [ "$code" != "200" ]; then failed=1; fi
          done
          if [ "$failed" = 1 ]; then
            echo "::error::A public page on $BASE did not return 200."
            exit 1
          fi
