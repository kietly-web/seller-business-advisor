name: LLM eval

on:
  pull_request:
    types: [labeled, synchronize]
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: live explain eval
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'llm-eval')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require the eval key
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY_EVAL }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Add the ANTHROPIC_API_KEY_EVAL secret (a separate key with a monthly spend limit) to run the live eval."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run packages/llm/src/eval
        env:
          ANTHROPIC_API_KEY_EVAL: ${{ secrets.ANTHROPIC_API_KEY_EVAL }}
          LLM_MODEL_EXPLAIN: ${{ vars.LLM_MODEL_EXPLAIN || 'claude-opus-5-5' }}
